version: "3.9"

services:
  # ─────────────────────────────────────────────────────────
  # Canary Target App — Vulnerable FastAPI with race condition
  # ─────────────────────────────────────────────────────────
  canary-target:
    build:
      context: .
      dockerfile: Dockerfile.target
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # ChaosTwin Engine — Orchestrator + WebSocket API
  # ─────────────────────────────────────────────────────────
  chaostwin-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    ports:
      - "8001:8001"
    environment:
      - TARGET_URL=http://canary-target:8000
      - MOCK_MODE=${MOCK_MODE:-true}
      - NEBIUS_API_KEY=${NEBIUS_API_KEY:-mock-key}
      - NEBIUS_BASE_URL=${NEBIUS_BASE_URL:-https://api.tokenfactory.nebius.com/v1/}
      - NEBIUS_MODEL=${NEBIUS_MODEL:-nvidia/nemotron-3-super-120b-a12b}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - ENGINE_PORT=8001
    depends_on:
      canary-target:
        condition: service_healthy
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────
  # Dashboard — Next.js Web UI
  # ─────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_ENGINE_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001/ws
    depends_on:
      - chaostwin-engine
    restart: unless-stopped
